<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Bienestar</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <script src="../js/graficos.js" defer></script>
    <script src="../js/admin.js" defer></script>
    <script src="../js/reportes.js" defer></script>

    <style>
        :root {
            --admin-primary: #1e293b;
            --admin-secondary: #334155;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-weight: 700;
            font-size: 2rem;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .nav-admin {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            list-style: none;
            padding: 0;
        }

        .nav-admin a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .nav-admin a:hover {
            background: white;
            color: var(--admin-primary);
            transform: translateY(-2px);
        }

        main {
            max-width: 1200px;
            margin: -30px auto 50px;
            padding: 0 20px;
        }

        .tabs-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
            overflow: hidden;
        }

        .tabs-nav {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }

        .tab-btn {
            padding: 15px 25px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            font-size: 0.9rem;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--admin-primary);
            border-bottom-color: var(--admin-primary);
            background: white;
        }

        .tab-pane {
            display: none;
            padding: 35px;
        }

        .tab-pane.active {
            display: block;
            animation: fadeInUp 0.5s;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8fafc;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: 800;
            margin: 10px 0 0;
            color: var(--admin-primary);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
            height: 350px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            font-weight: 600;
            font-size: 0.75rem;
            padding: 15px;
            text-transform: uppercase;
            border-bottom: 2px solid #f1f5f9;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .btn-submit {
            background: var(--admin-primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="animate__animated animate__fadeInDown">
        <div class="header-container">
            <h1>Panel Administrativo</h1>
            <p>Bienestar Universitario | Consola de Control Global</p>
            <ul class="nav-admin">
                <li><a href="#" id="downloadCitasBtn"><i class="fas fa-file-excel"></i> Reporte Citas</a></li>
                <li><a href="#" id="downloadRecsBtn"><i class="fas fa-file-pdf"></i> Reporte Recomendaciones</a></li>
                <li><a href="perfil.html"><i class="fas fa-user-edit"></i> Mi Perfil</a></li>
                <li><a href="../index.html" onclick="localStorage.clear()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="tabs-container animate__animated animate__fadeInUp">
            <div class="tabs-nav">
                <button class="tab-btn active" onclick="showTab('home', this)">Dashboard</button>
                <button class="tab-btn" onclick="showTab('userList', this)">Gestión Usuarios</button>
                <button class="tab-btn" data-tab="addUser" onclick="showTab('addUser', this)">Registrar Nuevo</button>
                <button class="tab-btn" data-tab="updateUser" onclick="showTab('updateUser', this)" style="display:none;">Editar Usuario</button>
            </div>

            <div id="home" class="tab-pane active">
                <div class="grid-stats">
                    <div class="stat-card">
                        <h3>Total Comunidad</h3>
                        <p id="userCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Citas de Hoy</h3>
                        <p id="totalCitas">0</p>
                    </div>
                </div>

                <div class="chart-grid">
                    <div class="chart-container">
                        <canvas id="myChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <canvas id="combinedChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="userList" class="tab-pane">
                <div style="overflow-x: auto;">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="addUser" class="tab-pane">
                <form id="userForm" style="max-width: 500px; margin: 0 auto;">
                    <label>Nombre Completo</label>
                    <input type="text" class="form-control" name="nombre" required>

                    <label>Identificación</label>
                    <input type="text" class="form-control" name="identificacion" required>

                    <label>Correo Institucional</label>
                    <input type="email" class="form-control" name="correo" required>

                    <label>Usuario</label>
                    <input type="text" class="form-control" name="username" required>

                    <label>Contraseña Temporal</label>
                    <input type="password" class="form-control" name="password" required>

                    <label>Rol Asignado</label>
                    <select class="form-control" name="rol" required>
                        <option value="estudiante">Estudiante</option>
                        <option value="psicologo">Psicólogo</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="admin">Administrador</option>
                        <option value="Actividades">Actividades</option>
                    </select>

                    <button type="submit" class="btn-submit">Dar de Alta</button>
                </form>
            </div>

            <div id="updateUser" class="tab-pane">
                <h2 style="text-align: center; margin-bottom: 30px;">Actualizar Usuario</h2>
                <form id="updateForm" style="max-width: 500px; margin: 0 auto;">
                    <input type="hidden" name="id" id="updateId">
                    <label>Nombre Completo</label>
                    <input type="text" class="form-control" name="nombre" id="updateNombre" required>
                    
                    <label>Identificación</label>
                    <input type="text" class="form-control" name="identificacion" id="updateIdentificacion" required>

                    <label>Correo Institucional</label>
                    <input type="email" class="form-control" name="correo" id="updateCorreo" required>

                    <label>Teléfono</label>
                    <input type="text" class="form-control" name="telefono" id="updateTelefono">

                    <label>Usuario (Username)</label>
                    <input type="text" class="form-control" name="username" id="updateUsername" required>

                    <label>Rol Asignado</label>
                    <select class="form-control" name="rol" id="updateRol" required>
                        <option value="estudiante">Estudiante</option>
                        <option value="psicologo">Psicología</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="admin">Administrador</option>
                        <option value="Actividades">Actividades</option>
                    </select>
                    
                    <label>Contraseña Temporal (Opcional)</label>
                    <input type="password" class="form-control" name="password" placeholder="Dejar en blanco para mantener la actual">
                    
                    <button type="submit" class="btn-submit">Actualizar Usuario</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>

</html>
